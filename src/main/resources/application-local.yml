spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/api_invocationsdb
    username: api_invocations
    password: api_invocations
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

gatcha:
  auth-api:
    # Hors Docker, API_authentification écoute sur localhost:8081 (port hôte exposé par la
    # stack racine) — les défauts (host.docker.internal:8080) ne sont valides que dans le
    # réseau docker. Sans cette surcharge, tout appel via le profil `local` aboutirait en 500.
    host: http://localhost
    port: 8081

server:
  # 8090 pour ne pas entrer en collision avec le port hôte 8081 d'api-authentification
  # dans la stack Docker (cf. root docker-compose.yaml).
  port: 8090
